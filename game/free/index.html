<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, shrink-to-fit=no"
        />
        <title>Free Games - ilyasuperglue.github.io</title>
        <link rel="icon" href="../../images/favicon.png" />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        />
        <link rel="stylesheet" href="./index.css" />
    </head>
    <body>
        <header class="game-header">
            <a
                href="../../index.html"
                class="game-back"
                aria-label="Back to portfolio"
            >
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <span class="game-header-title">Free Games</span>
            <button id="refreshBtn" class="game-refresh" aria-label="Refresh">
                <i class="fa-solid fa-rotate-right"></i>
            </button>
        </header>

        <main class="game-container" id="gameContainer">
            <div class="game-loading" id="gameLoading">
                <div class="spinner"></div>
            </div>
        </main>

        <script src="./index.js"></script>
    </body>
</html>
